# Build de l'image du worker et publication sur GHCR.
#
# Pourquoi ce workflow existe: le builder GitHub integre de RunPod a cesse de
# produire des releases apres 04a172b (2026-08-19). Les pushes arrivaient bien
# sur GitHub, aucune build n'en sortait. On construit donc ailleurs, et
# l'endpoint tire l'image depuis GHCR.
#
# L'image de base vLLM pese 11 Go compresses. Un push inter-registres ne peut
# pas monter les couches d'un autre registre: tout doit remonter. D'ou la build
# cote datacenter plutot que depuis un poste de travail.

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Le runner offre ~25-30 Go libres, l'image en fait ~30 une fois
      # decompressee. Sans ce menage, la build meurt en "no space left".
      - name: Liberer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v4

      - name: Sha court
        id: vars
        run: echo "short_sha=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # L'attestation de provenance ajoute un index multi-plateformes que
          # RunPod ne sait pas resoudre: il tire alors le manifeste au lieu de
          # l'image.
          provenance: false
          tags: |
            ghcr.io/bkhenniche/creative-ads-qwen-vl-main:${{ steps.vars.outputs.short_sha }}
            ghcr.io/bkhenniche/creative-ads-qwen-vl-main:latest
